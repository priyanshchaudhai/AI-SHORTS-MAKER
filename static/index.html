<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Shorts Maker</title>
<style>
* { box-sizing: border-box; }
body {
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.container {
  max-width: 650px;
  margin: 30px auto;
  padding: 25px;
  background: #151d32;
  border-radius: 18px;
}
h1 { color: #67e8b5; }
input, select, button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 10px;
}
input, select {
  background: #202b43;
  color: white;
}
button {
  background: #18a878;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .6; }
#status { margin-top: 20px; overflow-wrap: anywhere; }
video { width: 100%; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
<h1>AI Shorts Maker 🎬</h1>
<p>Turn long videos into short clips with AI.</p>

<form id="uploadForm">

<label>Select Video</label>
<input type="file" id="videoFile"
accept="video/*" required>

<label>Aspect Ratio</label>
<select id="format">
<option value="9:16">Vertical 9:16</option>
<option value="16:9">Landscape 16:9</option>
<option value="1:1">Square 1:1</option>
</select>

<button type="submit">🚀 Create AI Shorts</button>

</form>

<div id="status"></div>
</div>

<script src="/static/script.js?v=2"></script>
</body>
</html>
